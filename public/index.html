<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KC • ยืม–คืนม็อกอัป</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">KC<span>MOCKUP LIBRARY</span></a><span class="header-note">ดูแลของที่ยืม ให้พร้อมใช้ครั้งต่อไป</span><button id="add">＋ เพิ่มรายการยืม</button></header>
<main><div class="intro"><div><p class="eyebrow">พื้นที่ทำงาน / ยืม–คืน</p><h1>ม็อกอัปอยู่ที่ใคร?</h1><p class="muted">ติดตามของที่ยืม กำหนดคืน และประวัติในที่เดียว</p></div><div id="connection" role="status">กำลังเชื่อมต่อ…</div></div>
<section class="stats" aria-label="สรุปรายการ"><button data-filter="active" class="stat"><span>กำลังยืม</span><strong id="activeCount">—</strong><small>รายการที่ต้องติดตาม</small></button><button data-filter="overdue" class="stat overdue"><span>เกินกำหนด</span><strong id="overdueCount">—</strong><small>ถึงเวลาติดตามการคืน</small></button><button data-filter="returned" class="stat"><span>คืนแล้ว</span><strong id="returnedCount">—</strong><small>รวมประวัติที่เก็บไว้</small></button></section>
<section class="workspace"><div class="tools"><nav aria-label="สถานะรายการ"><button data-filter="active" class="selected">กำลังยืม</button><button data-filter="overdue">เกินกำหนด</button><button data-filter="returned">คืนแล้ว</button><button data-filter="archived">ประวัติเก่า</button></nav><label class="search"><span class="sr-only">ค้นหารายการ</span><input id="search" type="search" placeholder="ค้นหาม็อกอัป / ชื่อผู้ยืม…" maxlength="160"></label><button id="refresh" class="secondary" aria-label="โหลดข้อมูลใหม่">↻</button><button id="print" class="secondary">พิมพ์</button></div><div class="list-heading"><h2 id="listTitle">รายการที่กำลังยืม</h2><span id="total" class="muted"></span></div><p id="notice" role="alert" hidden></p><div id="records" aria-live="polite"></div><footer class="pagination"><span id="pageInfo"></span><div><button id="prev" class="secondary">← ก่อนหน้า</button><button id="next" class="secondary">ถัดไป →</button></div></footer></section><p class="footnote">ประวัติเก่า: คืนแล้วเกิน 90 วัน • รูปถูกย่อเพื่อประหยัดพื้นที่ • ยังไม่มีการลบรูปอัตโนมัติ</p></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><div><p class="eyebrow">KC MOCKUP</p><h2 id="formTitle">เพิ่มรายการยืม</h2></div><button type="button" class="secondary" id="close">ปิด ✕</button></div><div class="fields"><label class="wide">ชื่อม็อกอัป / รายการ *<input name="item" required maxlength="160" placeholder="เช่น ตัวอย่างบานเลื่อน Fuji สีดำ"></label><label>ชื่อผู้ยืม *<input name="borrower" required maxlength="120" autocomplete="name"></label><label>โทร / LINE / ช่องทางติดต่อ<input name="contact" maxlength="160"></label><label>จำนวน *<input name="quantity" type="number" min="1" max="100000" step="1" required value="1"></label><label>วันที่ยืม *<input name="borrow_date" type="date" required></label><label>กำหนดคืน<input name="due_date" type="date"></label><label class="wide">หมายเหตุ / สภาพของ<textarea name="description" maxlength="2000" rows="3"></textarea></label><label class="wide photo-input">รูปม็อกอัป <input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>ย่อรูปอัตโนมัติ • JPEG, PNG, WebP ไม่เกิน 15 MB</small></label><img id="photoPreview" alt="รูปตัวอย่าง" hidden></div><p id="formError" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel" class="secondary">ยกเลิก</button><button id="save" type="submit">บันทึกรายการ</button></div></form></dialog>
<dialog id="viewer"><button id="closeViewer" class="secondary">ปิด ✕</button><img id="fullImage" alt="ภาพม็อกอัปขนาดใหญ่"></dialog><div id="toast" role="status" hidden></div></body></html>
